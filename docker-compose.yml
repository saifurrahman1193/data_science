version: '3.3'

services:
  jupyter:
    image: continuumio/anaconda3
    container_name: jupyter-notebook
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    command: >
      jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser
      --allow-root --NotebookApp.token='' --NotebookApp.password=''
      --NotebookApp.notebook_dir='/home/jovyan/work'
